services:
  api:
    build: .
    env_file:
      - .env
    environment:
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432

    ports:
      - "8000:8000"

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d devcollabDB"]
      interval: 5s
      timeout: 5s
      retries: 5

  stripe:
    image: stripe/stripe-cli:latest
    command: listen --forward-to http://api:8000/api/webhooks/stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_DEVICE_NAME: devcollab_docker
    depends_on:
      - api

volumes:
  pgdata:
